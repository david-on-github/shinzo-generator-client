services:
  generator:
    # :latest is the newest release. Pin to a version (vX.Y.Z) for production.
    image: ghcr.io/shinzonetwork/shinzo-generator-client:${SHINZO_GENERATOR_VERSION:-latest}
    container_name: shinzo-generator
    restart: unless-stopped
    ports:
      - "80:8080"    # HTTP: health, metrics, registration, snapshots, schema, DefraDB API (/api/v0/)
      - "9171:9171"  # libp2p P2P
    volumes:
      - data:/app/data
    environment:                 # values come from .env (see .env.sample); unset = built-in default
      - GETH_RPC_URL=${GETH_RPC_URL}
      - GETH_WS_URL=${GETH_WS_URL}
      - GETH_API_KEY=${GETH_API_KEY:-}
      - GETH_API_KEY_TYPE=${GETH_API_KEY_TYPE:-}
      - SHINZO_KEY_PASSPHRASE=${SHINZO_KEY_PASSPHRASE:-}
      - INDEXER_START_HEIGHT=${INDEXER_START_HEIGHT:-0}
      - SCHEMA_AUTH_MODE=${SCHEMA_AUTH_MODE:-none}
      - SCHEMA_API_KEYS=${SCHEMA_API_KEYS:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - LOG_LEVEL=${LOG_LEVEL:-}

volumes:
  data:
    name: shinzo-generator-data   # all node state (database, keys). Docker-managed; inspect with `docker volume inspect shinzo-generator-data`
